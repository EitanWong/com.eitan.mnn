name: Package release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version of an existing v-prefixed tag on main (for example 3.6.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate version input
        shell: bash
        run: |
          [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Use a semantic package version without a v prefix.'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Verify tag, package version and main ancestry
        shell: bash
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          package = json.loads(Path('Packages/com.eitan.mnn/package.json').read_text())
          assert package['version'] == os.environ['PACKAGE_VERSION'], 'Tag and package version differ'
          PYCODE
      - name: Validate release sources
        run: |
          python3 -B Packages/com.eitan.mnn/Tools~/Validation/validate_package.py
          python3 -B Packages/com.eitan.mnn/Tools~/Validation/validate_repository.py
      - name: Archive the package subdirectory
        shell: bash
        run: |
          mkdir -p 'TestArtifacts~/Release'
          git archive --format=tar --prefix=package/ --mtime="$(git show -s --format=%cI HEAD)" HEAD:Packages/com.eitan.mnn | gzip -n > 'TestArtifacts~/Release/com.eitan.mnn.tgz'
          cd 'TestArtifacts~/Release'
          sha256sum com.eitan.mnn.tgz > SHA256SUMS
      - name: Create or update a draft release
        shell: bash
        run: |
          tag="v$PACKAGE_VERSION"
          state="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" || state=missing
          if [ "$state" = false ]; then echo 'Refusing to modify a published release.'; exit 1; fi
          if [ "$state" = missing ]; then
            gh release create "$tag" --verify-tag --draft --title "MNN for Unity $PACKAGE_VERSION" \
              --notes-file Packages/com.eitan.mnn/CHANGELOG.md
          fi
          gh release upload "$tag" 'TestArtifacts~/Release/com.eitan.mnn.tgz' 'TestArtifacts~/Release/SHA256SUMS' --clobber
