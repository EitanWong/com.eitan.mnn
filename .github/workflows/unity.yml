name: Unity native validation

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope (uses the committed affine fixture; no model downloads)
        type: choice
        options: [contract, affine]
        default: affine

permissions:
  contents: read

# This licensed runner executes trusted dev/main commits only, never fork PR code.
concurrency:
  group: unity-native-validation
  cancel-in-progress: false

jobs:
  unity:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, mnn-unity]
    environment: unity-validation
    timeout-minutes: 45
    env:
      UNITY_EDITOR: ${{ vars.MNN_UNITY_EXECUTABLE }}
      VALIDATION_SCOPE: ${{ inputs.scope }}
      UNITY_PROJECT: ${{ github.workspace }}/TestArtifacts~/CI/${{ github.run_id }}-${{ github.run_attempt }}/UnityProject
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check runner prerequisites
        run: |
          test -x "$UNITY_EDITOR" || { echo 'Set MNN_UNITY_EXECUTABLE to a licensed Unity 2021.3.45f2 executable.'; exit 1; }
          python3 --version
      - name: Create an isolated Unity project
        run: python3 -B Packages/com.eitan.mnn/Tools~/Testing/prepare_ci_project.py --project "$UNITY_PROJECT"
      - name: Run Mono PlayMode validation
        shell: bash
        run: |
          extra=()
          if [ "$VALIDATION_SCOPE" = contract ]; then extra+=(--contract-only); fi
          python3 -B Packages/com.eitan.mnn/Tools~/Testing/run_platform_tests.py \
            --unity "$UNITY_EDITOR" --project "$UNITY_PROJECT" \
            --platform PlayMode --backend Mono2x "${extra[@]}"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestArtifacts~/MNNValidation/PlatformValidation/PlayMode-Mono2x*/
          if-no-files-found: warn
          retention-days: 14
